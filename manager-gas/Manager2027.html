lendar-head button{border:1px solid var(--line);background:white;border-radius:8px;padding:7px 12px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.calendar-grid button{border:1px solid transparent;background:transparent;border-radius:8px;min-height:40px;color:var(--ink);position:relative}.calendar-grid button.has{background:#f4e9e8}.calendar-grid button.selected{background:var(--wine);color:white}.calendar-grid .dow{font-size:11px;color:var(--muted);padding:6px 0}.calendar-grid .blank{min-height:40px}.detail{background:#fffdfa;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;line-height:1.9}.detail h3{font-size:15px;color:var(--wine);margin:0 0 6px}.detail .total{font-size:18px;font-weight:700;color:var(--wine)}.slotline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid #f2eae3;font-size:13px}.slotline:last-child{border:0}.slottime{font-weight:600}.chefday{background:#fffdfa;border:1px solid var(--line);border-radius:12px;padding:13px;margin:9px 0}.chefhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700}.cheftotal{font-size:24px;color:var(--wine);font-weight:800}.chefgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.chefshift{background:#f7eee9;border-radius:9px;text-align:center;padding:10px 4px}.chefshift strong{display:block;font-size:23px;color:var(--ink)}.chefshift span{font-size:12px;color:var(--muted)}.chefnotice{color:#a14439;font-size:12px;margin-top:6px}.tabs{flex-wrap:wrap}.tabs button{flex:1 1 29%;font-size:12px}.entry{background:#fffdfa;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.entry label{display:block;font-weight:600;margin-top:9px}.entry .twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.entry .action{background:var(--wine);color:#fff;border:0;border-radius:9px;padding:12px;width:100%;margin-top:12px;font-weight:700}.ent /* 116 中秋管理介面｜簡約暖白 × 酒紅 */
:root{--wine:#794557;--ink:#3d3632;--muted:#857d77;--line:#e9e3dc;--bg:#f7f6f3}
body{font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;letter-spacing:.015em}
header{background:#fff;border-bottom:1px solid #eee8e2;padding:25px max(20px,calc((100vw - 1040px)/2));box-shadow:0 1px 9px #392b2310}
header h1{font-size:23px;letter-spacing:.06em;color:#65404c;font-weight:750;margin-bottom:5px}
header .muted{font-size:12px;letter-spacing:.12em}
main{max-width:1040px;padding:23px 20px 70px}
button{font-family:inherit;transition:background .18s,border-color .18s,transform .18s;cursor:pointer}
button:hover:not(:disabled){filter:brightness(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #a47886;outline-offset:2px}
button.reload{background:#fff;color:var(--wine);border:1px solid #d9c9ce;border-radius:10px;padding:10px 16px;font-weight:650}
#message{display:inline-block;margin:0 0 0 14px;font-size:12px;vertical-align:middle}
.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:23px 0}
.stat,.card,.capacity,.entry,.detail,.chefday,.calendar{background:#fff;border:1px solid #ebe6df;border-radius:15px;box-shadow:0 3px 18px #35251c09}
.stat{padding:18px 21px;color:#83756f;font-size:12px;font-weight:600}
.stat strong{font-size:30px;line-height:1.45;color:#68424e;letter-spacing:-.04em}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;background:#eeeae5;border-radius:13px;padding:5px;margin:18px 0 19px}
.tabs button{min-width:0;flex:none;border:0;border-radius:9px;padding:12px 6px;font-size:13px;background:transparent;color:#6f655f;font-weight:650}
.tabs button.active{background:#fff;color:#744455;box-shadow:0 2px 8px #3e29201c}
#searchBox{display:grid;grid-template-columns:minmax(0,2fr) minmax(150px,1fr);gap:12px;margin-bottom:14px}
input,select,textarea{font-family:inherit;width:100%;background:#fff;border:1px solid #e2dbd4;border-radius:10px;padding:12px 13px;font-size:14px;color:var(--ink);margin:5px 0 11px}
#searchBox input,#searchBox select{margin:0}
input::placeholder,textarea::placeholder{color:#aaa19a}
.card{margin:12px 0;padding:20px 22px;line-height:1.85;border-left:3px solid #c9aeb6}
.card .line{align-items:center;margin-bottom:5px}
.card .line strong{font-size:17px;color:#493c38}
.card>.muted{font-size:12px;letter-spacing:.035em}
.pill{font-size:12px;background:#f4ebe9;color:#794557;border:1px solid #eadbdf;padding:3px 11px;font-weight:650}
button.collect,.entry .action{background:#794557;border-radius:10px;min-height:44px;letter-spacing:.04em}
.entry{padding:24px;margin:15px 0}
.entry h2{font-size:19px;margin:0 0 15px;color:#62414d}
.entry label{font-size:13px;color:#594b45}
.capacity,.detail,.chefday{padding:19px}
.calendar{padding:19px}
.calendar-grid button{min-height:45px}
.calendar-grid button.has{background:#f6efec}
.calendar-grid button.selected{background:#794557}
.chefshift{background:#f7f2ef}
.bar{height:8px;background:#eee9e4}
.bar>div{background:#9b6576}
#results>.muted,#results>p{line-height:1.8}
@media(max-width:720px){
 header{padding:20px 16px}header h1{font-size:20px}
 main{padding:17px 13px 55px}
 .stats{gap:8px;margin:16px 0}
 .stat{padding:13px 11px;font-size:11px}
 .stat strong{font-size:25px}
 .tabs{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
 .tabs button{padding:11px 3px;font-size:12px}
 #searchBox{grid-template-columns:1fr}
 .card{padding:16px}
 .entry{padding:17px}
 #message{display:block;margin:10px 0 0}
}
@media(max-width:390px){.entry .twocol{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat strong{font-size:22px}}
</style></head><body>
<header><h1>紀家烘焙坊｜訂單管理</h1><div class="muted">116 年中秋｜內部訂單管理</div></header>
<main><button class="reload" onclick="load()">重新整理資料</button><p id="message">正在載入訂單…</p><section class="stats" id="stats"></section>
<div class="tabs"><button data-tab="new" onclick="switchTab('new')">新增訂單</button><button data-tab="delivery" onclick="switchTab('delivery')">宅配到府</button><button class="active" data-tab="pickup" onclick="switchTab('pickup')">門市自取</button><button data-tab="capacity" onclick="switchTab('capacity')">每日產能</button><button data-tab="chef" onclick="switchTab('chef')">師傅專區</button><button data-tab="vip" onclick="switchTab('vip')">老闆 VIP</button></div>
<div id="searchBox"><input id="search" placeholder="搜尋訂單編號、姓名或電話" oninput="render()"><select id="filter" onchange="render()"><option value="all">全部付款狀態</option><option value="待核帳">待核帳</option><option value="未付款">未付款</option><option value="已付款">已付款</option><option value="逾期未付">逾期未付</option></select></div>
<div id="calendarWrap" class="hide"><div class="calendar"><div class="calendar-head"><button onclick="moveMonth(-1)">‹</button><strong id="monthLabel"></strong><button onclick="moveMonth(1)">›</button></div><div id="calendarGrid" class="calendar-grid"></div></div></div><section id="results"></section><p class="muted">訂單核帳可直接於管理介面操作；宅配單號及出貨狀態仍由試算表管理。</p></main>
<script>
let data=null,tab='pickup',selectedDay='',viewMonth='',chefDay='',chefMonth='';const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function switchTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('searchBox').classList.toggle('hide',['capacity','new','vip','chef'].includes(t));$('calendarWrap').classList.toggle('hide',t!=='capacity');render()}
function load(){ $('message').textContent='讀取中…';google.script.run.withSuccessHandler(d=>{data=d;$('message').textContent='更新時間：'+d.generatedAt;render()}).withFailureHandler(e=>{$('message').textContent='讀取失敗：'+e.message}).managerSnapshot2027()}
function render(){if(!data)return;const c=data.counts;$('stats').innerHTML=[['自取訂單',c.pickup],['待核帳',data.pickup.filter(o=>o.payment==='待核帳').length],['未付款',data.pickup.filter(o=>o.payment==='未付款'&&o.status!=='已取消').length]].map(x=>'<div class="stat">'+esc(x[0])+'<strong>'+esc(x[1])+'</strong></div>').join('');
if(tab==='capacity'){renderCalendar();return}
if(tab==='new'){renderNew();return}
if(tab==='vip'){renderVip();return}
if(tab==='chef'){renderChef();return}

const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=data[tab].filter(o=>(f==='all'||o.payment===f)&&(!q||[o.id,o.name,o.phone].some(v=>String(v).toLowerCase().includes(q))));
$('results').innerHTML=list.length?list.map(o=>'<article class="card"><div class="line"><strong>'+esc(o.name)+'</strong><span class="pill">'+esc(o.payment)+'</span></div><div class="muted">'+esc(o.id)+'</div><div>'+esc(o.date)+' · '+esc(o.slot)+'</div><div>'+esc(o.quantity)+'</div><div>顆數：'+esc(o.pieces)+' · 金額：NT$ '+esc(o.amount)+'</div><div>電話：'+esc(o.phone)+'</div>'+(o.address?'<div>地址：'+esc(o.address)+'</div>':'')+'<div>訂單：'+esc(o.status)+' · 匯款末五碼：'+esc(o.remittance||'—')+'</div>'+(o.tracking?'<div>黑貓單號：'+esc(o.tracking)+'</div>':'')+(o.slipConfirmation?'<div>宅配單確認：'+esc(o.slipConfirmation)+'</div>':'')+(['pickup','delivery'].includes(tab)&&['未付款','待核帳','逾期未付'].includes(o.payment)&&!['已取消','取消','作廢','已退款','已取貨','已出貨'].includes(o.status)?'<button class="collect" onclick="confirmPayment('+JSON.stringify(tab).replace(/"/g,'&quot;')+','+JSON.stringify(o.id).replace(/"/g,'&quot;')+')">確認已收款</button>':'')+ (tab==='pickup'&&o.payment==='已付款'&&['已確認','製作中'].includes(o.status)?'<button class="collect" onclick="collect('+JSON.stringify(o.id).replace(/"/g,'&quot;')+')">確認已取貨</button>':'')+'</article>').join(''):'沒有符合條件的訂單'}


let draftKind='自取',newBusy=false,vipBusy=false,newRequest='',vipRequest='';
function requestToken(){return 'M'+Date.now().toString(36)+Math.random().toString(36).slice(2,14)}
function field(id,label,type='text'){return '<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'">'}
function num(id,label){return field(id,label,'number')}
function val(id){return $(id)?$(id).value.trim():''}
function renderNew(){
 $('results').innerHTML='<div class="entry"><h2>新增一般訂單</h2><label>訂單類型</label><select id="newKind" onchange="draftKind=this.value;renderNew()"><option value="自取" '+(draftKind==='自取'?'selected':'')+'>門市自取</option><option value="宅配" '+(draftKind==='宅配'?'selected':'')+'>宅配到府</option></select>'+
 field('newName','姓名')+field('newPhone','電話','tel')+(draftKind==='自取'?'<label for="newDate">取貨日期</label><input id="newDate" type="date" onchange="updateNewPickupSlots()">':field('newDate','出貨日期','date'))+
 (draftKind==='自取'?'<label for="newSlot">取貨時段</label><select id="newSlot" disabled><option value="">請先選擇取貨日期</option></select><div class="twocol">'+num('newSix','6入盒數')+num('newFifteen','15入盒數')+'</div>':
 field('newAddress','收件地址')+'<label for="newInvoiceType">發票類型</label><select id="newInvoiceType" onchange="toggleNewTaxId()"><option value="一般發票">一般發票（不需統編）</option><option value="公司發票">公司發票（需統編）</option></select><div id="newTaxIdWrap" class="hide"><label for="newTaxId">統一編號（8 碼）</label><input id="newTaxId" type="text" inputmode="numeric" maxlength="8" placeholder="請輸入 8 碼統一編號"></div><div class="twocol">'+num('newFour','6入4盒組')+num('newTen','6入10盒組')+num('newGroup','6入15盒組')+num('newFifteen','15入盒數')+num('newBags','提袋數')+'</div>')+
 '<label>付款方式</label><select id="newPayment" onchange="document.getElementById(\'newPayMethodWrap\').classList.toggle(\'hide\',this.value!==\'已收款\')"><option value="待付款">待付款（72小時）</option><option value="已收款">現場已收款</option></select><div id="newPayMethodWrap" class="hide"><label>現場收款方式</label><select id="newPayMethod"><option value="現金">現金</option><option value="轉帳">轉帳</option></select></div>'+
 field('newNotes','備註')+'<button id="newSubmit" class="action" onclick="submitNew()">確認建立訂單</button><p class="muted" id="newMsg">送出前請核對日期、數量及收款狀態；金額由後端計算。</p></div>';
}
function updateNewPickupSlots(){
 const date=val('newDate'),select=$('newSlot');if(!select)return;
 const previous=select.value;let options=[];
 if(/^\\d{4}-\\d{2}-\\d{2}$/.test(date)){
  const day=new Date(date+'T00:00:00Z').getUTCDay();
  options=date==='2027-09-15'?['09:00–10:00']:([0,6].includes(day)?['09:00–12:00','13:00–15:00','15:00–17:00','17:00–18:00']:['13:00–15:00','15:00–17:00','17:00–18:00']);
 }
 select.disabled=!options.length;
 select.innerHTML='<option value="">'+(options.length?'請選擇取貨時段':'請先選擇取貨日期')+'</option>'+options.map(v=>'<option value="'+v+'">'+v+'</option>').join('');
 if(options.includes(previous))select.value=previous;
}
function toggleNewTaxId(){const wrap=$('newTaxIdWrap');if(!wrap)return;const company=val('newInvoiceType')==='公司發票';wrap.classList.toggle('hide',!company);if(!company)$('newTaxId').value='';}
function submitNew(){
 if(newBusy)return;
 const kind=val('newKind'),paid=val('newPayment')==='已收款';
 const payload={method:kind,name:val('newName'),phone:val('newPhone'),date:val('newDate'),slot:val('newSlot'),six:val('newSix')||0,fifteen:val('newFifteen')||0,address:val('newAddress'),invoiceType:val('newInvoiceType')||'一般發票',taxId:val('newTaxId'),four:val('newFour')||0,ten:val('newTen')||0,group:val('newGroup')||0,bags:val('newBags')||0,payment:val('newPayment'),payMethod:paid?val('newPayMethod'):'',notes:val('newNotes'),requestId:newRequest||requestToken()};
 if(!payload.name||!payload.phone||!payload.date||(kind==='自取'&&!payload.slot)){$('newMsg').textContent='請填寫姓名、電話、日期與取貨時段';return}
 if(kind==='宅配'&&payload.invoiceType==='公司發票'&&!/^\d{8}$/.test(payload.taxId)){$('newMsg').textContent='公司發票請填寫 8 碼統一編號';return}
 if(!confirm('確認建立'+kind+'訂單？付款狀態：'+(paid?'現場已收款（'+payload.payMethod+'）':'待付款')+'。'))return;
 newRequest=payload.requestId;newBusy=true;$('newSubmit').disabled=true;$('newMsg').textContent='正在建立訂單…';
 google.script.run.withSuccessHandler(res=>{newBusy=false;newRequest='';renderNew();$('newMsg').textContent='上一筆建立成功：'+res.orderId+'｜金額 NT$'+res.amount+(res.duplicate?'（重複送單，未再次建立）':'')+'。可繼續填寫下一筆訂單。';}).withFailureHandler(e=>{newBusy=false;$('newSubmit').disabled=false;$('newMsg').textContent='建立失敗：'+e.message}).mgrNewOrder2027(payload);
}
function renderVip(){
 const list=data.vip||[];
 $('results').innerHTML='<div class="entry"><h2>老闆 VIP 公關單</h2><p class="muted">不限產能，仍計入師傅盤數。僅限授權管理人員操作。</p>'+
 field('vipName','公關對象／單位')+field('vipDate','製作日期','date')+
 '<div class="twocol"><div><label>製作時段</label><select id="vipShift"><option>上午</option><option>下午</option></select></div><div><label>交付方式</label><select id="vipMethod"><option>自取</option><option>宅配</option></select></div></div>'+
 '<div class="twocol">'+num('vipSix','6入盒數')+num('vipFifteen','15入盒數')+'</div>'+field('vipContact','聯絡資訊／宅配地址（選填）')+field('vipNotes','備註（選填）')+
 '<button id="vipSubmit" class="action" onclick="submitVip()">新增 VIP 公關單</button><p class="muted" id="vipMsg"></p></div>'+
 '<h2>VIP 公關單紀錄</h2>'+(list.length?list.slice().reverse().map(o=>'<div class="card"><div class="line"><strong>'+esc(o.name)+'</strong><span class="pill">'+esc(o.status)+'</span></div><div>'+esc(o.date)+' · '+esc(o.shift)+' · '+esc(o.method)+'</div><div>6入 '+o.boxes6+' 盒／15入 '+o.boxes15+' 盒</div><div class="muted">'+esc(o.id)+'</div>'+(o.status!=='已取消'&&o.status!=='已完成'?'<button class="collect" onclick="cancelVip('+JSON.stringify(o.id).replace(/"/g,'&quot;')+')">取消這筆 VIP 單</button>':'')+'</div>').join(''):'<p class="muted">尚無 VIP 公關單</p>');
}
function submitVip(){
 if(vipBusy)return;const payload={name:val('vipName'),date:val('vipDate'),shift:val('vipShift'),method:val('vipMethod'),six:val('vipSix')||0,fifteen:val('vipFifteen')||0,contact:val('vipContact'),notes:val('vipNotes'),requestId:vipRequest||requestToken()};
 if(!payload.name||!payload.date){$('vipMsg').textContent='請填寫對象與製作日期';return}
 if(!confirm('確認新增 VIP 公關單？'+payload.date+' '+payload.shift+'製作。'))return;
 vipRequest=payload.requestId;vipBusy=true;$('vipSubmit').disabled=true;$('vipMsg').textContent='正在新增…';
 google.script.run.withSuccessHandler(r=>{vipBusy=false;vipRequest='';alert('VIP 單已建立：'+r.orderId);load()}).withFailureHandler(e=>{vipBusy=false;$('vipSubmit').disabled=false;$('vipMsg').textContent='新增失敗：'+e.message}).mgrNewVip2027(payload);
}
function cancelVip(id){if(!confirm('確定取消 VIP 公關單 '+id+'？'))return;google.script.run.withSuccessHandler(()=>load()).withFailureHandler(e=>alert('取消失敗：'+e.message)).mgrCancelVip2027(id)}

function moveMonth(delta){const [y,m]=viewMonth.split('-').map(Number);const d=new Date(y,m-1+delta,1);viewMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderCalendar()}
function chooseDay(d){selectedDay=d;renderCalendar()}
function fmt(x){return '15入 × '+x.boxes15+' 盒；6入 × '+x.boxes6+' 盒；合計 '+x.pans+' 盤'}
function weekday(date){const [y,m,d]=date.split('-').map(Number);return '日一二三四五六'[new Date(y,m-1,d).getDay()]}
function chefKey(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function chefChoose(key){chefDay=key;renderChef()}
function chefMoveMonth(n){const [y,m]=chefMonth.split('-').map(Number);const dt=new Date(y,m-1+n,1);chefMonth=chefKey(dt).slice(0,7);renderChef()}
function chefCard(key,compact){
 const x=data.capacity.find(d=>d.date===key),am=x?x.morning.pans:0,pm=x?x.afternoon.pans:0,total=am+pm;
 const label=key.slice(5).replace('-','/')+'（'+weekday(key)+'）';
 return '<div class="chefday"><div class="chefhead"><span>'+label+'</span><span class="cheftotal">'+total+' 盤</span></div>'+
 '<div class="chefgrid"><div class="chefshift"><span>上午</span><strong>'+am+' 盤</strong></div><div class="chefshift"><span>下午</span><strong>'+pm+' 盤</strong></div></div>'+
 (x&&x.unclassified.pieces?'<div class="chefnotice">有未分類自取時段，請管理人員檢查；盤數尚未包含該部分。</div>':'')+
 (x&&x.total>4800?'<div class="chefnotice">已超過每日 80 盤產能上限</div>':'')+'</div>';
}
function renderChef(){
 const today=new Date(),todayKey=chefKey(today);
 if(!chefDay)chefDay=todayKey;
 if(!chefMonth)chefMonth=chefDay.slice(0,7);
 const [y,m]=chefMonth.split('-').map(Number),offset=new Date(y,m-1,1).getDay(),count=new Date(y,m,0).getDate();
 const available=new Set(data.capacity.map(d=>d.date));
 let cells=['日','一','二','三','四','五','六'].map(w=>'<span class="dow">'+w+'</span>').join('')+'<span class="blank"></span>'.repeat(offset);
 for(let i=1;i<=count;i++){const key=chefMonth+'-'+String(i).padStart(2,'0');cells+='<button class="'+(available.has(key)?'has ':'')+(chefDay===key?'selected':'')+'" onclick="chefChoose(\''+key+'\')">'+i+'</button>'}
 let html='<div class="calendar"><div class="calendar-head"><button onclick="chefMoveMonth(-1)">‹</button><strong>'+y+' 年 '+m+' 月</strong><button onclick="chefMoveMonth(1)">›</button></div><div class="calendar-grid">'+cells+'</div></div>';
 html+='<h3>選取日期｜製作盤數</h3>'+chefCard(chefDay,false);
 html+='<div class="line" style="align-items:center;margin:18px 0 8px"><h3 style="margin:0">未來七日</h3><button class="reload" onclick="chefDay=chefKey(new Date());chefMonth=chefDay.slice(0,7);renderChef()">回到今天</button></div>';
 for(let i=0;i<7;i++){const dt=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);const key=chefKey(dt);html+=chefCard(key,true)}
 $('results').innerHTML=html;
}

function pickupSlotRows(d){
 const special=d.date==='2027-09-15';
 const weekend=[0,6].includes(new Date(d.date+'T00:00:00Z').getUTCDay());
 const slots=[
 ['09:00~10:00','09:00～10:00（中秋特別）',special],
 ['09:00~12:00','09:00～12:00（週末）',weekend&&!special],
 ['13:00~15:00','13:00～15:00',!special],
 ['15:00~17:00','15:00～17:00',!special],
 ['17:00~18:00','17:00～18:00',!special]
 ];
 return slots.filter(([key,label,normal])=>normal||d.slots[key].pieces>0)
  .map(([key,label])=>rowCompact(label,d.slots[key])).join('');
}
function rowCompact(title,x){return '<div class="slotline"><span class="slottime">'+esc(title)+'</span><span>15入×'+x.boxes15+'　6入×'+x.boxes6+'　<strong>'+x.pans+'盤</strong></span></div>'}
function renderCalendar(){
 const today=new Date(),dates=data.capacity.map(x=>x.date);
 if(!viewMonth){const first=dates.find(x=>x>=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0'));selectedDay=first||dates[0]||today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');viewMonth=selectedDay.slice(0,7)}
 const [y,m]=viewMonth.split('-').map(Number);$('monthLabel').textContent=y+' 年 '+m+' 月';
 const offset=new Date(y,m-1,1).getDay(),count=new Date(y,m,0).getDate(),set=new Set(dates);
 let cells=['日','一','二','三','四','五','六'].map(x=>'<span class="dow">'+x+'</span>').join('')+'<span class="blank"></span>'.repeat(offset);
 for(let i=1;i<=count;i++){const d=viewMonth+'-'+String(i).padStart(2,'0');cells+='<button class="'+(set.has(d)?'has ':'')+(selectedDay===d?'selected':'')+'" onclick="chooseDay(\''+d+'\')">'+i+'</button>'}
 $('calendarGrid').innerHTML=cells;
 const d=data.capacity.find(x=>x.date===selectedDay);
 if(!d){$('results').innerHTML='<div class="detail"><strong>'+esc(selectedDay)+'（'+weekday(selectedDay)+'）</strong><p class="muted">當日沒有有效訂單產能。</p></div>';return}
 const row=(title,x)=>'<div><strong>'+title+'：</strong>'+fmt(x)+'</div>';
 $('results').innerHTML='<div class="detail"><div class="total">'+esc(d.date.slice(5).replace('-','/'))+'（'+weekday(d.date)+'）合計 '+d.pans+' 盤</div><div class="muted">共 '+d.total+' 顆／上限 '+d.limit+' 顆，剩餘 '+d.remaining+' 顆</div><hr>'+row('上午製作（含宅配）',d.morning)+row('下午製作',d.afternoon)+'</div>'+
 '<div class="detail"><h3>門市自取｜'+d.pickup.pans+' 盤</h3><div>'+fmt(d.pickup)+'</div><hr>'+pickupSlotRows(d)+(d.unclassified.pieces?'<p class="muted">未分類時段：'+fmt(d.unclassified)+'（請檢查 D 欄）</p>':'')+'</div>'+
 '<div class="detail"><h3>宅配合計（全部計入上午）</h3>'+fmt(d.delivery)+'</div>';
}

function confirmPayment(kind,id){
 const order=data&&data[kind]&&data[kind].find(o=>o.id===id);
 if(!order)return;
 if(!confirm('確認已實際收到 '+order.name+' 的款項 NT$'+order.amount+'？訂單：'+id))return;
 $('message').textContent='正在更新付款狀態…';
 document.querySelectorAll('button.collect').forEach(b=>b.disabled=true);
 google.script.run.withSuccessHandler(r=>{alert(r.already?'此訂單已付款':'已確認收款：'+id);load()}).withFailureHandler(e=>{alert('核帳失敗：'+e.message);load()}).mgrConfirmPayment2027(kind,id);
}
function collect(id){
 const order=data&&data.pickup.find(o=>o.id===id);if(!order)return;
 if(!confirm('確認「'+order.name+'」的訂單 '+id+' 已由客人取走？'))return;
 $('message').textContent='正在更新取貨狀態…';
 document.querySelectorAll('button.collect').forEach(b=>b.disabled=true);
 google.script.run.withSuccessHandler(r=>{alert(r.already?'這筆訂單先前已標記為已取貨':'已更新為「已取貨」');load()}).withFailureHandler(e=>{alert('更新失敗：'+e.message);load()}).markPickupCollected2027(id);
}
load();
</script></body></html>
