<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--wine:#803d50;--ink:#49352b;--muted:#867368;--line:#e8dbcf;--bg:#faf6f0}*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;background:var(--bg);color:var(--ink);font-size:14px}header{padding:18px 16px;background:#fffdfa;border-bottom:1px solid var(--line)}h1{font-size:21px;color:var(--wine);margin:0 0 6px}h2{font-size:15px;color:var(--wine)}main{padding:16px;max-width:760px;margin:auto}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:15px}.stat,.card,.capacity{background:#fffdfa;border:1px solid var(--line);border-radius:12px;padding:12px}.stat strong{display:block;font-size:22px;color:var(--wine)}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;background:white;border:1px solid var(--line);padding:9px 5px;border-radius:8px;color:var(--ink);cursor:pointer}.tabs button.active{background:var(--wine);color:white}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;margin:5px 0 10px}.card{margin:9px 0;line-height:1.7;overflow-wrap:anywhere}.card strong{color:var(--wine)}.line{display:flex;justify-content:space-between;gap:10px}.pill{font-size:11px;background:#f5ebe5;border-radius:20px;padding:2px 8px;white-space:nowrap}.capacity{margin:8px 0}.bar{height:6px;background:#eee4dd;border-radius:8px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:var(--wine)}button.collect{width:100%;padding:12px;margin-top:10px;background:#803d50;color:#fff;border:0;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer}button.collect:disabled{opacity:.55;cursor:wait}button.reload{background:var(--wine);color:white;border:0;border-radius:8px;padding:9px 13px;cursor:pointer}#message{margin:12px 0;color:var(--muted)}.calendar{background:#fffdfa;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calendar-head button{border:1px solid var(--line);background:white;border-radius:8px;padding:7px 12px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.calendar-grid button{border:1px solid transparent;background:transparent;border-radius:8px;min-height:40px;color:var(--ink);position:relative}.calendar-grid button.has{background:#f4e9e8}.calendar-grid button.selected{background:var(--wine);color:white}.calendar-grid .dow{font-size:11px;color:var(--muted);padding:6px 0}.calendar-grid .blank{min-height:40px}.detail{background:#fffdfa;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;line-height:1.9}.detail h3{font-size:15px;color:var(--wine);margin:0 0 6px}.detail .total{font-size:18px;font-weight:700;color:var(--wine)}.hide{display:none}</style></head><body>
<header><h1>紀家烘焙坊｜訂單管理</h1><div class="muted">116 年中秋 · TEST｜僅供內部管理</div></header>
<main><button class="reload" onclick="load()">重新整理資料</button><p id="message">正在載入訂單…</p><section class="stats" id="stats"></section>
<div class="tabs"><button class="active" data-tab="pickup" onclick="switchTab('pickup')">門市自取</button><button data-tab="delivery" onclick="switchTab('delivery')">宅配到府</button><button data-tab="capacity" onclick="switchTab('capacity')">每日產能</button></div>
<div id="searchBox"><input id="search" placeholder="搜尋訂單編號、姓名或電話" oninput="render()"><select id="filter" onchange="render()"><option value="all">全部付款狀態</option><option value="待核帳">待核帳</option><option value="未付款">未付款</option><option value="已付款">已付款</option><option value="逾期未付">逾期未付</option></select></div>
<div id="calendarWrap" class="hide"><div class="calendar"><div class="calendar-head"><button onclick="moveMonth(-1)">‹</button><strong id="monthLabel"></strong><button onclick="moveMonth(1)">›</button></div><div id="calendarGrid" class="calendar-grid"></div></div></div><section id="results"></section><p class="muted">可在自取訂單點選「確認已取貨」。其他核帳與訂單修改仍請在試算表操作。</p></main>
<script>
let data=null,tab='pickup',selectedDay='',viewMonth='';const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function switchTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('searchBox').classList.toggle('hide',t==='capacity');$('calendarWrap').classList.toggle('hide',t!=='capacity');render()}
function load(){ $('message').textContent='讀取中…';google.script.run.withSuccessHandler(d=>{data=d;$('message').textContent='更新時間：'+d.generatedAt;render()}).withFailureHandler(e=>{$('message').textContent='讀取失敗：'+e.message}).managerSnapshot2027()}
function render(){if(!data)return;const c=data.counts;$('stats').innerHTML=[['自取訂單',c.pickup],['宅配訂單',c.delivery],['待核帳',c.pendingReview],['未付款',c.unpaid]].map(x=>'<div class="stat">'+esc(x[0])+'<strong>'+esc(x[1])+'</strong></div>').join('');
if(tab==='capacity'){renderCalendar();return}

const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=data[tab].filter(o=>(f==='all'||o.payment===f)&&(!q||[o.id,o.name,o.phone].some(v=>String(v).toLowerCase().includes(q))));
$('results').innerHTML=list.length?list.map(o=>'<article class="card"><div class="line"><strong>'+esc(o.name)+'</strong><span class="pill">'+esc(o.payment)+'</span></div><div class="muted">'+esc(o.id)+'</div><div>'+esc(o.date)+' · '+esc(o.slot)+'</div><div>'+esc(o.quantity)+'</div><div>顆數：'+esc(o.pieces)+' · 金額：NT$ '+esc(o.amount)+'</div><div>電話：'+esc(o.phone)+'</div>'+(o.address?'<div>地址：'+esc(o.address)+'</div>':'')+'<div>訂單：'+esc(o.status)+' · 匯款末五碼：'+esc(o.remittance||'—')+'</div>'+(o.tracking?'<div>黑貓單號：'+esc(o.tracking)+'</div>':'')+(o.slipConfirmation?'<div>宅配單確認：'+esc(o.slipConfirmation)+'</div>':'')+(tab==='pickup'&&o.payment==='已付款'&&['已確認','製作中'].includes(o.status)?'<button class="collect" onclick="collect('+JSON.stringify(o.id).replace(/"/g,'&quot;')+')">確認已取貨</button>':'')+'</article>').join(''):'沒有符合條件的訂單'}

function moveMonth(delta){const [y,m]=viewMonth.split('-').map(Number);const d=new Date(y,m-1+delta,1);viewMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderCalendar()}
function chooseDay(d){selectedDay=d;renderCalendar()}
function fmt(x){return '15入 × '+x.boxes15+' 盒；6入 × '+x.boxes6+' 盒；合計 '+x.pans+' 盤'}
function weekday(date){const [y,m,d]=date.split('-').map(Number);return '日一二三四五六'[new Date(y,m-1,d).getDay()]}
function renderCalendar(){
 const today=new Date(),dates=data.capacity.map(x=>x.date);
 if(!viewMonth){const first=dates.find(x=>x>=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0'));selectedDay=first||dates[0]||today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');viewMonth=selectedDay.slice(0,7)}
 const [y,m]=viewMonth.split('-').map(Number);$('monthLabel').textContent=y+' 年 '+m+' 月';
 const offset=new Date(y,m-1,1).getDay(),count=new Date(y,m,0).getDate(),set=new Set(dates);
 let cells=['日','一','二','三','四','五','六'].map(x=>'<span class="dow">'+x+'</span>').join('')+'<span class="blank"></span>'.repeat(offset);
 for(let i=1;i<=count;i++){const d=viewMonth+'-'+String(i).padStart(2,'0');cells+='<button class="'+(set.has(d)?'has ':'')+(selectedDay===d?'selected':'')+'" onclick="chooseDay(\''+d+'\')">'+i+'</button>'}
 $('calendarGrid').innerHTML=cells;
 const d=data.capacity.find(x=>x.date===selectedDay);
 if(!d){$('results').innerHTML='<div class="detail"><strong>'+esc(selectedDay)+'（'+weekday(selectedDay)+'）</strong><p class="muted">當日沒有有效訂單產能。</p></div>';return}
 const row=(title,x)=>'<div><strong>'+title+'：</strong>'+fmt(x)+'</div>';
 $('results').innerHTML='<div class="detail"><div class="total">'+esc(d.date.slice(5).replace('-','/'))+'（'+weekday(d.date)+'）合計 '+d.pans+' 盤</div><div class="muted">共 '+d.total+' 顆／上限 '+d.limit+' 顆，剩餘 '+d.remaining+' 顆</div><hr>'+row('上午（含宅配）',d.morning)+row('下午',d.afternoon)+'</div>'+
 '<div class="detail"><h3>門市自取合計</h3>'+fmt(d.pickup)+'<hr>'+row('09:00~12:00',d.slots['09:00~12:00'])+row('13:00~15:00',d.slots['13:00~15:00'])+row('17:00~18:00',d.slots['17:00~18:00'])+(d.unclassified.pieces?'<p class="muted">未對應指定時段：'+fmt(d.unclassified)+'（請確認試算表 D 欄）</p>':'')+'</div>'+
 '<div class="detail"><h3>宅配合計（全部計入上午）</h3>'+fmt(d.delivery)+'</div>';
}

function collect(id){
 const order=data&&data.pickup.find(o=>o.id===id);if(!order)return;
 if(!confirm('確認「'+order.name+'」的訂單 '+id+' 已由客人取走？\\n確定後會更新試算表的訂單狀態。'))return;
 $('message').textContent='正在更新取貨狀態…';
 document.querySelectorAll('button.collect').forEach(b=>b.disabled=true);
 google.script.run.withSuccessHandler(r=>{alert(r.already?'這筆訂單先前已標記為已取貨':'已更新為「已取貨」');load()}).withFailureHandler(e=>{alert('更新失敗：'+e.message);load()}).markPickupCollected2027(id);
}
load();
</script></body></html>
