<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--wine:#803d50;--ink:#49352b;--muted:#867368;--line:#e8dbcf;--bg:#faf6f0}*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;background:var(--bg);color:var(--ink);font-size:14px}header{padding:18px 16px;background:#fffdfa;border-bottom:1px solid var(--line)}h1{font-size:21px;color:var(--wine);margin:0 0 6px}h2{font-size:15px;color:var(--wine)}main{padding:16px;max-width:760px;margin:auto}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:15px}.stat,.card,.capacity{background:#fffdfa;border:1px solid var(--line);border-radius:12px;padding:12px}.stat strong{display:block;font-size:22px;color:var(--wine)}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;background:white;border:1px solid var(--line);padding:9px 5px;border-radius:8px;color:var(--ink);cursor:pointer}.tabs button.active{background:var(--wine);color:white}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;margin:5px 0 10px}.card{margin:9px 0;line-height:1.7;overflow-wrap:anywhere}.card strong{color:var(--wine)}.line{display:flex;justify-content:space-between;gap:10px}.pill{font-size:11px;background:#f5ebe5;border-radius:20px;padding:2px 8px;white-space:nowrap}.capacity{margin:8px 0}.bar{height:6px;background:#eee4dd;border-radius:8px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:var(--wine)}button.reload{background:var(--wine);color:white;border:0;border-radius:8px;padding:9px 13px;cursor:pointer}#message{margin:12px 0;color:var(--muted)}.hide{display:none}</style></head><body>
<header><h1>紀家烘焙坊｜訂單管理</h1><div class="muted">116 年中秋 · TEST｜僅供內部檢視</div></header>
<main><button class="reload" onclick="load()">重新整理資料</button><p id="message">正在載入訂單…</p><section class="stats" id="stats"></section>
<div class="tabs"><button class="active" data-tab="pickup" onclick="switchTab('pickup')">門市自取</button><button data-tab="delivery" onclick="switchTab('delivery')">宅配到府</button><button data-tab="capacity" onclick="switchTab('capacity')">每日產能</button></div>
<div id="searchBox"><input id="search" placeholder="搜尋訂單編號、姓名或電話" oninput="render()"><select id="filter" onchange="render()"><option value="all">全部付款狀態</option><option value="待核帳">待核帳</option><option value="未付款">未付款</option><option value="已付款">已付款</option><option value="逾期未付">逾期未付</option></select></div>
<section id="results"></section><p class="muted">此管理介面目前為唯讀版。核帳與訂單修改仍請在試算表操作。</p></main>
<script>
let data=null,tab='pickup';const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function switchTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('searchBox').classList.toggle('hide',t==='capacity');render()}
function load(){ $('message').textContent='讀取中…';google.script.run.withSuccessHandler(d=>{data=d;$('message').textContent='更新時間：'+d.generatedAt;render()}).withFailureHandler(e=>{$('message').textContent='讀取失敗：'+e.message}).managerSnapshot2027()}
function render(){if(!data)return;const c=data.counts;$('stats').innerHTML=[['自取訂單',c.pickup],['宅配訂單',c.delivery],['待核帳',c.pendingReview],['未付款',c.unpaid]].map(x=>'<div class="stat">'+esc(x[0])+'<strong>'+esc(x[1])+'</strong></div>').join('');
if(tab==='capacity'){$('results').innerHTML=data.capacity.length?data.capacity.map(x=>'<div class="capacity"><div class="line"><strong>'+esc(x.date)+'</strong><span>'+esc(x.total)+' / '+esc(x.limit)+' 顆</span></div><div>自取 '+esc(x.pickup)+' · 宅配 '+esc(x.delivery)+' · '+esc(x.pans)+' 盤 · 剩餘 '+esc(x.remaining)+'</div><div class="bar"><div style="width:'+Math.min(100,x.total/x.limit*100)+'%"></div></div></div>').join(''):'目前沒有產能資料';return}
const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=data[tab].filter(o=>(f==='all'||o.payment===f)&&(!q||[o.id,o.name,o.phone].some(v=>String(v).toLowerCase().includes(q))));
$('results').innerHTML=list.length?list.map(o=>'<article class="card"><div class="line"><strong>'+esc(o.name)+'</strong><span class="pill">'+esc(o.payment)+'</span></div><div class="muted">'+esc(o.id)+'</div><div>'+esc(o.date)+' · '+esc(o.slot)+'</div><div>'+esc(o.quantity)+'</div><div>顆數：'+esc(o.pieces)+' · 金額：NT$ '+esc(o.amount)+'</div><div>電話：'+esc(o.phone)+'</div>'+(o.address?'<div>地址：'+esc(o.address)+'</div>':'')+'<div>訂單：'+esc(o.status)+' · 匯款末五碼：'+esc(o.remittance||'—')+'</div>'+(o.tracking?'<div>黑貓單號：'+esc(o.tracking)+'</div>':'')+(o.slipConfirmation?'<div>宅配單確認：'+esc(o.slipConfirmation)+'</div>':'')+'</article>').join(''):'沒有符合條件的訂單'}
load();
</script></body></html>
