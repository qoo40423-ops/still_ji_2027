<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>116年中秋｜紀家烘焙坊計價測試</title>
<style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#faf6f0;color:#493b35;margin:0}main{max-width:640px;margin:32px auto;padding:24px;background:#fff;border-radius:16px;box-shadow:0 8px 30px #4c302010}h1{color:#803d50;font-size:24px}p{line-height:1.8}.grid{display:grid;grid-template-columns:1fr 110px;gap:14px;align-items:center;margin:18px 0}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d9ccc2;border-radius:8px;font-size:16px}button{background:#803d50;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}#result{margin-top:24px;padding:18px;background:#faf6f0;border-radius:12px;white-space:pre-line;line-height:1.9}small{color:#76685f}.warn{color:#a33b2e}
/* Still Ji 2027 — shared literary typography across all pages */
:root{--sj-font:"Noto Serif TC","Songti TC","PMingLiU",serif;--sj-heading:var(--sj-font)}
html,body,header,nav,footer,main,section,article,aside,div,p,span,a,li,td,th,label,small,strong,b,h1,h2,h3,h4,h5,h6,summary,button,input,select,textarea,option{font-family:var(--sj-font)!important}
button,input,select,textarea{font-size:inherit}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet"></head><body><main>
<h1>紀家烘焙坊｜116 年中秋計價測試</h1>
<p>此頁僅供內部測試，<strong>不會建立訂單，也不會傳送客戶資料。</strong></p>
<div class="grid">
<label for="four">6 入 × 4 盒組（組數）</label><input id="four" type="number" min="0" step="1" value="0">
<label for="ten">6 入 × 10 盒組（組數）</label><input id="ten" type="number" min="0" step="1" value="0">
<label for="fifteenGroup">6 入 × 15 盒組（組數）</label><input id="fifteenGroup" type="number" min="0" step="1" value="2">
<label for="fifteenBoxes">15 入禮盒（盒數）</label><input id="fifteenBoxes" type="number" min="0" step="1" value="0">
<label for="bags">6 入不織布提袋（個數）</label><input id="bags" type="number" min="0" step="1" value="6">
<label for="remote">宜蘭、花蓮、台東</label><input id="remote" type="checkbox">
</div><button id="calc" type="button">計算金額</button><div id="result" role="status" aria-live="polite"></div>
<p><small>15 入宅配至少 4 盒、每箱最多 10 盒，每箱運費 $210；宜花東每箱加 $10。尚待確認：非 6 入 15 盒組的提袋加購方式及離島配送。</small></p>
</main><script src="pricing-2027.js"></script><script>
function show(){const fields=["four","ten","fifteenGroup","fifteenBoxes","bags"];const data={};fields.forEach(id=>data[id]=document.getElementById(id).value);data.remote=document.getElementById("remote").checked;const output=document.getElementById("result");try{const x=StillJi2027.calculate(data);output.className=x.requiresReview?"warn":"";output.textContent="6 入禮盒："+x.sixBoxes+" 盒\n15 入禮盒："+x.fifteenBoxes+" 盒\n15 盒組提袋分配："+(x.bagAllocation.join("、")||"無")+"\n商品金額：$"+x.goods+"\n提袋金額：$"+x.bagAmount+"\n6 入運費：$"+x.shippingSix+"\n15 入運費（"+x.fifteenCartons+" 箱）：$"+x.shippingFifteen+"\n宜花東加價：$"+x.remoteSurcharge+"\n總額（暫算）：$"+x.total+(x.requiresReview?"\n⚠️ 本組合含尚待確認的運費條件，不可直接收款。":"");}catch(e){output.className="warn";output.textContent="⚠️ "+e.message;}}
document.getElementById("calc").addEventListener("click",show);show();
</script></body></html>
